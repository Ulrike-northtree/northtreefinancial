<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ulrike Tooke · NorthTree Financial</title>
  <meta name="description" content="Ulrike Tooke, Financial Broker at NorthTree Financial. Call, email, book a meeting, or save my contact details." />
  <meta property="og:title" content="Ulrike Tooke · NorthTree Financial" />
  <meta property="og:description" content="Financial Broker — Orienting Wealth. Deepening Roots." />
  <meta property="og:type" content="profile" />
  <style>
    :root {
      --bg: #1f281a;
      --panel: #2f3d2b;
      --panel-2: #273320;
      --fg: #f1e9d9;
      --muted: #b7b4a0;
      --accent: #b99750;
      --accent-soft: #ccab6a;
      --accent-ink: #26301d;
      --border: rgba(241, 233, 217, 0.13);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px calc(28px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1100px 560px at 50% -12%, #3a4a33 0%, var(--bg) 60%);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 32px 24px 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    .photo {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 22%;
      margin: 0 auto 18px;
      display: block;
      border: 3px solid rgba(185, 151, 80, 0.65);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 650;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }
    .title {
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1.7;
      margin: 0 0 12px;
    }
    .company { font-size: 1rem; font-weight: 600; margin: 0; }
    .tagline {
      color: var(--muted);
      font-size: 0.9rem;
      font-style: italic;
      margin: 4px 0 0;
    }
    .divider {
      height: 1px;
      background: var(--border);
      margin: 22px 0;
      border: 0;
    }
    .actions { display: flex; flex-direction: column; gap: 11px; }
    .btn {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      padding: 14px 16px;
      border-radius: 13px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--border);
      background: rgba(241, 233, 217, 0.05);
      color: var(--fg);
      transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover { background: rgba(241, 233, 217, 0.1); border-color: rgba(241, 233, 217, 0.22); }
    .btn:active { transform: scale(0.985); }
    .btn .ico { flex: 0 0 22px; width: 22px; height: 22px; color: var(--accent); }
    .btn .ico svg { width: 100%; height: 100%; display: block; }
    .btn .label { text-align: left; }
    .btn.primary {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }
    .btn.primary:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
    .btn.primary .ico { color: var(--accent-ink); }
    .footer {
      margin-top: 22px;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="photo" src="/connect/headshot.jpg" alt="Ulrike Tooke" />
    <h1>Ulrike Tooke</h1>
    <p class="title">Financial Broker<br />Mushroom Farmer</p>
    <p class="company">NorthTree Financial</p>
    <p class="tagline">Orienting Wealth. Deepening Roots.</p>

    <hr class="divider" />

    <nav class="actions">
      <a class="btn primary" href="/connect/ulrike-tooke.vcf" download="Ulrike-Tooke.vcf">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg></span>
        <span class="label">Save to contacts</span>
      </a>

      <a class="btn" href="tel:+15874343571">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
        <span class="label">Call 587-434-3571</span>
      </a>

      <a class="btn" href="mailto:ulrike@northtreefinancial.ca">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>
        <span class="label">Email me</span>
      </a>

      <a class="btn" href="https://forms.fillout.com/t/wcuxgzThZKus" target="_blank" rel="noopener">
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="m9 16 2 2 4-4"/></svg></span>
        <span class="label">Book a meeting</span>
      </a>
    </nav>

    <p class="footer">NorthTree Financial</p>
  </main>
</body>
</html>
